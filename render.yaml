services:
  - type: web
    name: pomisuke-linebot
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: node index.js
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: LINE_GROUP_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: LOCAL_LLM_URL
        sync: false
      - key: LOCAL_LLM_TOKEN
        sync: false
      - key: CARSHARE_FORM_URL
        sync: false
      - key: LEDGER_FORM_URL
        sync: false
      - key: GAS_NOTIFY_SECRET
        sync: false
      - key: USER_ID_A
        sync: false
      - key: USER_ID_S
        sync: false
      - key: USER_ID_N
        sync: false
      - key: NODE_ENV
        value: production
